<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DripMen | Products</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" />

  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <!-- Top Announcement Bar -->
  <div class="announcement-bar" id="announcement-bar">
    <span>Sign up and get 20% off to your first order. Sign Up Now</span>
    <button class="close-announcement" aria-label="Close">
      <i class="ph ph-x"></i>
    </button>
  </div>

  <!-- Navbar -->
  <header class="navbar">
    <!-- Content injected by js/main.js -->
  </header>

  <main class="products-page">
    <!-- Breadcrumb -->
    <div class="breadcrumb-container">
      <nav class="breadcrumb">
        <a href="index.html">Home</a>
        <span class="separator"><i class="ph ph-caret-right"></i></span>
        <span class="current">Products</span>
      </nav>
    </div>

    <section class="products-main-section">
      <div class="products-layout">

        <!-- Mobile Filter Toggle -->
        <div class="mobile-filter-header">
          <button class="filter-toggle-btn" id="filter-toggle-btn">
            <i class="ph ph-sliders"></i> Filters
          </button>
        </div>

        <!-- Filters Sidebar -->
        <aside class="filters-sidebar" id="filters-sidebar">

          <div class="filter-header-mobile">
            <h2>Filters</h2>
            <button class="close-filter-btn" id="close-filter-btn">
              <i class="ph ph-x"></i>
            </button>
          </div>

          <div class="filter-section header-desktop">
            <h2 class="filter-title">
              Filters <i class="ph ph-sliders"></i>
            </h2>
          </div>
          <hr class="filter-divider" />

          <!-- Categories — dynamically loaded from API by products.js -->
          <div class="filter-section">
            <ul class="category-list" id="category-filter-list">
              <li>
                <a href="#" class="filter-category-btn active" data-category="">
                  All <i class="ph ph-caret-right"></i>
                </a>
              </li>
              <!-- More items injected by products.js -->
            </ul>
          </div>
          <hr class="filter-divider" />

          <!-- Price -->
          <div class="filter-section">
            <div class="filter-title-row">
              <h3>Price</h3>
              <i class="ph ph-caret-up"></i>
            </div>
            <div class="price-slider-container">
              <div class="slider-track" id="slider-track"></div>
              <input type="range" min="50" max="300" value="50" class="price-range min-range" id="min-range" />
              <input type="range" min="50" max="300" value="300" class="price-range max-range" id="max-range" />
              <div class="price-values">
                <span class="min-val" id="min-val">$50</span>
                <span class="max-val" id="max-val">$300</span>
              </div>
            </div>
          </div>
          <hr class="filter-divider" />

          <!-- Colors -->
          <div class="filter-section">
            <div class="filter-title-row">
              <h3>Colors</h3>
              <i class="ph ph-caret-up"></i>
            </div>
            <div class="color-options">
              <button class="color-swatch bg-black filter-color-btn" data-color="black" aria-label="Black"></button>
              <button class="color-swatch bg-white filter-color-btn" data-color="white" aria-label="White">
                <i class="ph ph-check" style="color:black; display:none"></i>
              </button>
              <button class="color-swatch filter-color-btn" data-color="blue"
                aria-label="Blue" style="background:#4285f4;">
                <i class="ph ph-check" style="display:none"></i>
              </button>
              <button class="color-swatch filter-color-btn" data-color="gray"
                aria-label="Grey" style="background:gray;"></button>
            </div>
          </div>
          <hr class="filter-divider" />

          <!-- Size -->
          <div class="filter-section">
            <div class="filter-title-row">
              <h3>Size</h3>
              <i class="ph ph-caret-up"></i>
            </div>
            <div class="size-options">
              <button class="size-pill filter-size-btn" data-size="S">S</button>
              <button class="size-pill filter-size-btn" data-size="M">M</button>
              <button class="size-pill filter-size-btn" data-size="L">L</button>
              <button class="size-pill filter-size-btn" data-size="XL">XL</button>
            </div>
          </div>
          <hr class="filter-divider" />

          <div class="filter-action">
            <button class="btn btn-primary full-width apply-filter-btn">
              Apply Filter
            </button>
          </div>

        </aside>

        <!-- Products View -->
        <div class="products-view">

          <!-- Sort Bar -->
          <div class="products-header">
            <div class="products-meta">
              <div class="sort-dropdown-container">
                <div class="sort-by" id="sort-trigger">
                  Sort by: <strong id="current-sort">Newest</strong>
                  <i class="ph ph-caret-down"></i>
                </div>
                <div class="sort-options" id="sort-options">
                  <div class="sort-option" data-value="newest">Newest Arrivals</div>
                  <div class="sort-option" data-value="price-low">Price: Low to High</div>
                  <div class="sort-option" data-value="price-high">Price: High to Low</div>
                </div>
              </div>
            </div>
          </div>

          <!-- Products Grid — fully injected by products.js -->
          <div class="products-grid-view" id="products-grid">
            <!-- Cards rendered by js/products.js -->
          </div>

          <hr class="pagination-divider" />

          <!-- Pagination -->
          <div class="pagination">
            <button class="pagination-btn prev-btn">
              <i class="ph ph-arrow-left"></i> Previous
            </button>
            <div class="page-numbers"></div>
            <button class="pagination-btn next-btn">
              Next <i class="ph ph-arrow-right"></i>
            </button>
          </div>

        </div>
      </div>
    </section>

    <!-- Modal Overlay -->
    <div class="modal-overlay" id="modal-overlay"></div>

    <!-- Add to Cart Success Modal -->
    <div class="modal" id="cart-modal">
      <button class="close-modal"><i class="ph ph-x"></i></button>
      <div class="modal-body text-center">
        <div class="modal-success-icon"><i class="ph-fill ph-check-circle"></i></div>
        <h3 class="modal-title">Item Added to Cart</h3>
        <div class="modal-product-inline">
          <img src="" alt="" id="cart-modal-img" class="modal-product-img-small" />
          <div class="modal-product-details-small">
            <h4 class="modal-product-name" id="cart-modal-name">Product Name</h4>
            <p class="modal-product-price" id="cart-modal-price">$0</p>
          </div>
        </div>
        <div class="modal-actions-row">
          <button class="btn btn-outline continue-shopping-btn">Continue Shopping</button>
          <button class="btn btn-primary go-to-cart-btn">Go to Cart</button>
        </div>
      </div>
    </div>

    <!-- Size Selection Modal -->
    <div class="modal" id="size-selection-modal">
      <button class="close-modal"><i class="ph ph-x"></i></button>
      <div class="modal-body">
        <h3 class="modal-title">Select Size</h3>
        <div class="modal-product-inline">
          <img src="" alt="Product" class="modal-product-img-small" id="size-modal-img" />
          <div class="modal-product-details-small">
            <h4 class="modal-product-name" id="size-modal-name">Product Name</h4>
            <p class="modal-product-price" id="size-modal-price">$0</p>
          </div>
        </div>
        <div class="size-selection-container">
          <p class="selection-label">Choose your size:</p>
          <div class="size-options-grid">
            <button class="size-btn" data-size="S">S</button>
            <button class="size-btn" data-size="M">M</button>
            <button class="size-btn active" data-size="L">L</button>
            <button class="size-btn" data-size="XL">XL</button>
          </div>
        </div>
        <button id="confirm-size-btn" class="btn btn-primary full-width">Add to Cart</button>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="footer" id="footer">
    <!-- Content injected by js/main.js -->
  </footer>

  <!-- Mobile menu overlay -->
  <div class="mobile-menu-overlay"></div>

  <!-- Products JS (loads API data + handles all filters) -->
  <script src="js/pages/products.js"></script>

  <!-- Main JS (navbar, cart, wishlist, modals) -->
  <script type="module" src="js/main.js"></script>

</body>
</html>
