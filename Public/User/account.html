<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DripMen | My Account</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <!-- ✅ OVERLAY -->
  <div id="sidebar-overlay" class="sidebar-overlay"></div>

  <!-- Announcement Bar -->
  <div class="announcement-bar" id="announcement-bar">
    <span>Sign up and get 20% off to your first order. Sign Up Now</span>
    <button class="close-announcement" aria-label="Close">
      <i class="ph ph-x"></i>
    </button>
  </div>

  <!-- Navbar -->
  <header class="navbar"></header>

  <!-- MAIN -->
  <main class="account-page">
    <div class="account-container">

      <!-- Breadcrumb -->
      <nav class="breadcrumb" aria-label="Breadcrumb">
        <a href="index.html">Home</a>
        <span class="separator"><i class="ph ph-caret-right"></i></span>
        <span class="current">My Account</span>
      </nav>

      <div class="account-layout">

        <!-- SIDEBAR -->
        <aside class="account-sidebar" id="account-sidebar">



          <div class="account-nav-section">
            <h3 class="account-nav-title">Manage Account</h3>
            <div class="account-nav-list">
              <a href="account.html" class="active">Profile</a>
              <a href="address.html">Address Book</a>
              <a href="payment.html">Payment Options</a>
            </div>
          </div>

          <div class="account-nav-section">
            <h3 class="account-nav-title">Orders</h3>
            <div class="account-nav-list">
              <a href="orders.html">Orders</a>
              <a href="returns.html">Returns</a>
              <a href="cancellations.html">Cancellations</a>
            </div>
          </div>

        </aside>

        <!-- CONTENT -->
        <section class="account-content">

          <div class="account-header">

            <h1>My Profile</h1>
          </div>
          <div class="account-tabs">
  <a href="account.html" class="tab active">Profile</a>
  <a href="address.html" class="tab">Address</a>
  <a href="payment.html" class="tab">Payment</a>
  <a href="orders.html" class="tab">Orders</a>
  <a href="returns.html" class="tab">Returns</a>
  <a href="cancellations.html" class="tab">Cancel</a>
</div>

          <!-- FORM -->
          <form id="account-form" class="account-form" novalidate>

            <div class="form-row">

              <div class="form-group">
                <label for="firstName">Full Name</label>
                <input 
                  id="firstName" 
                  name="name"
                  type="text" 
                  placeholder="Your name"
                  required
                >
              </div>

              <div class="form-group">
                <label for="email">Email Address</label>
                <input 
                  id="email" 
                  name="email"
                  type="email" 
                  placeholder="Your email"
                  required
                >
              </div>

            </div>

            <!-- PASSWORD -->
            <div class="password-change-section">
              <h2 class="section-subtitle">Change Password</h2>

              <div class="form-group">
                <input id="currentPassword" type="password" placeholder="Current Password">
              </div>

              <div class="form-group">
                <input id="newPassword" type="password" placeholder="New Password">
              </div>

              <div class="form-group">
                <input id="confirmPassword" type="password" placeholder="Confirm New Password">
              </div>
            </div>

            <!-- ACTIONS -->
            <div class="form-actions">
              <button id="cancel-btn" type="button" class="btn btn-outline">Cancel</button>

              <button id="save-changes-btn" type="submit" class="btn btn-primary">
                Save Changes
              </button>
            </div>

          </form>

        </section>

      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer" id="footer"></footer>

  <script type="module" src="js/main.js"></script>

</body>
</html>
