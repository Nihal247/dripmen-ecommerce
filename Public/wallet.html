<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DripMen | My Wallet</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <style>
        :root {
            --wallet-gradient: linear-gradient(135deg, #111 0%, #333 100%);
            --accent-gold: #d4af37;
        }
        .wallet-card {
            background: var(--wallet-gradient);
            border-radius: 24px;
            padding: 2.5rem;
            color: white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            margin-bottom: 2.5rem;
        }
        .wallet-card::after {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 300px;
            height: 300px;
            background: rgba(255,255,255,0.03);
            border-radius: 50%;
        }
        .balance-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.7;
            margin-bottom: 0.5rem;
            display: block;
        }
        .balance-amount {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 2rem;
            display: block;
        }
        .btn-add-money {
            background: white;
            color: #111;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: transform 0.3s ease, background 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .btn-add-money:hover {
            background: #f0f0f0;
            transform: translateY(-2px);
        }
        .transaction-section {
            background: white;
            border-radius: 20px;
            padding: 2rem;
            border: 1px solid #eee;
        }
        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 0;
            border-bottom: 1px solid #f5f5f5;
        }
        .transaction-item:last-child {
            border-bottom: none;
        }
        .trx-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .trx-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }
        .trx-icon.credit { background: #dcfce7; color: #16a34a; }
        .trx-icon.debit { background: #fee2e2; color: #dc2626; }
        
        .trx-details h4 { font-size: 1rem; margin-bottom: 0.2rem; color: #111; }
        .trx-details span { font-size: 0.8rem; color: #888; }
        
        .trx-amount { font-weight: 700; font-size: 1.1rem; }
        .trx-amount.credit { color: #16a34a; }
        .trx-amount.debit { color: #dc2626; }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
        }
        .input-group {
            margin-bottom: 1.5rem;
        }
        .input-group label {
            display: block;
            margin-bottom: 0.6rem;
            font-weight: 600;
            color: #333;
        }
        .input-group input {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid #ddd;
            font-size: 1.1rem;
            font-weight: 700;
            outline: none;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div id="navbar-placeholder"></div>

    <main class="container" style="max-width: 800px; margin-top: 6rem; min-height: 100vh; padding-bottom: 4rem;">
        <h1 style="font-weight: 800; margin-bottom: 2rem;">My Wallet</h1>

        <!-- Wallet Card -->
        <div class="wallet-card">
            <span class="balance-label">Available Balance</span>
            <span class="balance-amount">₹<span id="wallet-balance">0.00</span></span>
            <button class="btn-add-money" onclick="openTopupModal()">
                <i class="ph-bold ph-plus"></i> Add Money
            </button>
        </div>

        <!-- Transactions -->
        <div class="transaction-section">
            <h3 style="margin-bottom: 1.5rem; font-weight: 700;">Recent Transactions</h3>
            <div id="transaction-list">
                <!-- Items injected here -->
                <p style="text-align:center; color:#888; padding: 2rem;">Loading history...</p>
            </div>
        </div>
    </main>

    <!-- Topup Modal -->
    <div id="topupModal" class="modal">
        <div class="modal-content">
            <h2 style="margin-bottom: 1.5rem; font-weight: 800;">Add Money</h2>
            <div class="input-group">
                <label>Enter Amount (₹)</label>
                <input type="number" id="topup-amount" value="500" min="10">
            </div>
            <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                <button class="btn btn-outline" style="flex:1" onclick="closeTopupModal()">Cancel</button>
                <button class="btn btn-primary" style="flex:1" id="confirm-topup-btn">Next</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="js/main.js?v=cb5a5035"></script>
    <script type="module" src="js/pages/wallet.js"></script>
</body>
</html>
