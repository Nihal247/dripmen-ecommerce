<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DripMen Admin | Banners</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
<link rel="stylesheet" href="../User/css/style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="admin-container">
        <div class="sidebar-overlay"></div>
        <aside class="admin-sidebar">
            <div class="sidebar-header"><div class="logo">DRIPMEN</div></div>
            <nav class="sidebar-nav">
                <a href="admin.html" class="nav-item"><i class="ph ph-squares-four"></i> Dashboard</a>
                <a href="admin-users.html" class="nav-item"><i class="ph ph-users"></i> Users</a>
                <a href="admin-products.html" class="nav-item"><i class="ph ph-t-shirt"></i> Products</a>
                <a href="admin-inventory.html" class="nav-item"><i class="ph ph-stack"></i> Inventory</a>
                <a href="admin-categories.html" class="nav-item"><i class="ph ph-tag"></i> Categories</a>
                <a href="admin-orders.html" class="nav-item"><i class="ph ph-shopping-cart"></i> Orders</a>
                <a href="admin-coupons.html" class="nav-item"><i class="ph ph-ticket"></i> Coupons</a>
                <a href="admin-banners.html" class="nav-item active"><i class="ph ph-image"></i> Banners</a>
                <a href="admin-transactions.html" class="nav-item"><i class="ph ph-receipt"></i> Transactions</a>
                <a href="admin-sales-report.html" class="nav-item"><i class="ph ph-chart-bar"></i> Sales Report</a>
            </nav>
            <div class="sidebar-footer"><a href="index.html" class="nav-item"><i class="ph ph-sign-out"></i> Logout</a></div>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <div class="header-left">
                    <button class="menu-toggle"><i class="ph ph-list"></i></button>
                    <h2 class="page-title">Banners</h2>
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary" id="add-banner-btn">
                        <i class="ph ph-plus"></i> Add Banner
                    </button>
                </div>
            </header>

            <div class="admin-grid-cards" id="banners-grid">
                <!-- Banners injected via JS -->
            </div>
        </main>
    </div>

    <!-- Banner Modal -->
    <div id="banner-modal" class="admin-modal">
        <div class="admin-modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Add New Banner</h3>
                <button class="close-modal-btn"><i class="ph ph-x"></i></button>
            </div>
            <form id="banner-form" class="admin-form">
                <input type="hidden" id="banner-id">
                <div class="form-group">
                    <label>Banner Title</label>
                    <input type="text" name="title" required>
                </div>
                <div class="form-group">
                    <label>Banner Image</label>
                    <input type="file" name="image" accept="image/*">
                </div>
                <div class="form-group">
                    <label>Redirect Link</label>
                    <input type="text" name="link" placeholder="/products" value="/products">
                </div>
                <div class="form-group">
                    <label>Display Order</label>
                    <input type="number" name="order" value="0">
                </div>
                <button type="submit" class="btn btn-primary full-width">Save Banner</button>
            </form>
        </div>
    </div>

    <script src="admin.js"></script>
    <script src="js/admin-banners.js"></script>
</body>
</html>
