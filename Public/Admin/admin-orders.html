<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DripMen Admin | Orders</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://unpkg.com/@phosphor-icons/web"></script>

<link rel="stylesheet" href="../User/css/style.css">
<link rel="stylesheet" href="../Admin/admin.css">

</head>

<body>

<div class="admin-container">

<div class="sidebar-overlay"></div>

<!-- Sidebar -->
<aside class="admin-sidebar">

<div class="sidebar-header">
<div class="logo">DRIPMEN</div>
</div>

<nav class="sidebar-nav">

<a href="admin.html" class="nav-item">
<i class="ph ph-squares-four"></i> Dashboard
</a>

<a href="admin-users.html" class="nav-item">
<i class="ph ph-users"></i> Users
</a>

<a href="admin-products.html" class="nav-item">
<i class="ph ph-t-shirt"></i> Products
</a>

<a href="admin-inventory.html" class="nav-item">
<i class="ph ph-stack"></i> Inventory
</a>

<a href="admin-returns.html" class="nav-item">
<i class="ph ph-arrow-u-up-left"></i> Returns
</a>

<a href="admin-categories.html" class="nav-item">
<i class="ph ph-tag"></i> Categories
</a>

<a href="admin-orders.html" class="nav-item active">
<i class="ph ph-shopping-cart"></i> Orders
</a>

<a href="admin-coupons.html" class="nav-item">
<i class="ph ph-ticket"></i> Coupons
</a>

<a href="admin-banners.html" class="nav-item">
<i class="ph ph-image"></i> Banners
</a>

<a href="admin-transactions.html" class="nav-item">
<i class="ph ph-receipt"></i> Transactions
</a>

<a href="admin-sales-report.html" class="nav-item">
<i class="ph ph-chart-bar"></i> Sales Report
</a>

</nav>

<div class="sidebar-footer">
<a href="index.html" class="nav-item">
<i class="ph ph-sign-out"></i> Logout
</a>
</div>

</aside>

<!-- Main Content -->
<main class="admin-main">

<!-- Header -->
<header class="admin-header">

<div class="header-left">

<button class="menu-toggle">
<i class="ph ph-list"></i>
</button>

<h2 class="page-title">Orders</h2>

</div>

</header>

<!-- Toolbar -->
<div class="products-toolbar">

<div class="filters">

<button class="btn btn-outline active">All</button>
<button class="btn btn-outline">Pending</button>
<button class="btn btn-outline">Shipped</button>
<button class="btn btn-outline">Delivered</button>

</div>

<div class="search-box">
<i class="ph ph-magnifying-glass"></i>
<input type="text" placeholder="Search Order ID...">
</div>

</div>

<!-- Orders Table -->
<div class="recent-orders-section">

<div class="table-responsive">

<table class="admin-table">

<thead>
<tr>
<th>Order ID</th>
<th>Customer</th>
<th>Date</th>
<th>Total</th>
<th>Payment</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>

<tbody id="admin-orders-list"></tbody>

</table>

</div>

</div>

</main>

</div>

<script src="admin.js"></script>
<script src="./js/adminOrders.js"></script>

</body>
</html>
