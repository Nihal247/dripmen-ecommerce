<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DripMen Admin | Inventory</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="js/config.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="admin-container">
        <div class="sidebar-overlay"></div>
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <div class="logo">DRIPMEN</div>
            </div>
            <nav class="sidebar-nav">
                <a href="admin.html" class="nav-item"><i class="ph ph-squares-four"></i> Dashboard</a>
                <a href="admin-users.html" class="nav-item"><i class="ph ph-users"></i> Users</a>
                <a href="admin-products.html" class="nav-item"><i class="ph ph-t-shirt"></i> Products</a>
                <a href="admin-inventory.html" class="nav-item active"><i class="ph ph-stack"></i> Inventory</a>
                <a href="admin-returns.html" class="nav-item"><i class="ph ph-arrow-u-up-left"></i> Returns</a>
                <a href="admin-categories.html" class="nav-item"><i class="ph ph-tag"></i> Categories</a>
                <a href="admin-orders.html" class="nav-item"><i class="ph ph-shopping-cart"></i> Orders</a>
                <a href="admin-coupons.html" class="nav-item"><i class="ph ph-ticket"></i> Coupons</a>
                <a href="admin-banners.html" class="nav-item"><i class="ph ph-image"></i> Banners</a>
                <a href="admin-transactions.html" class="nav-item"><i class="ph ph-receipt"></i> Transactions</a>
                <a href="admin-sales-report.html" class="nav-item"><i class="ph ph-chart-bar"></i> Sales Report</a>
            </nav>
            <div class="sidebar-footer">
                <a href="index.html" class="nav-item"><i class="ph ph-sign-out"></i> Logout</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <!-- Top Header -->
            <header class="admin-header">
                <div class="header-left">
                    <button class="menu-toggle"><i class="ph ph-list"></i></button>
                    <h2 class="page-title">Inventory Management</h2>
                </div>
                <div class="header-actions">
                    <div class="admin-profile">
                        <img src="https://ui-avatars.com/api/?name=Admin+User&background=000&color=fff" alt="Admin">
                        <span>Admin</span>
                    </div>
                </div>
            </header>

            <!-- Inventory Toolbar -->
            <div class="products-toolbar">
                <div class="search-box">
                    <i class="ph ph-magnifying-glass"></i>
                    <input id="inventorySearch" type="text" placeholder="Search product stock...">
                </div>
                <div class="toolbar-actions">
                    <div class="filters">
                        <select id="inventoryCategory" class="filter-select">
                            <option value="">Category</option>
                        </select>
                        <select id="inventoryStatus" class="filter-select">
                            <option value="">Availability</option>
                            <option value="in_stock">In Stock</option>
                            <option value="low_stock">Low Stock (< 5)</option>
                            <option value="out_of_stock">Out of Stock (0)</option>
                        </select>
                    </div>
                    <button class="btn btn-outline" onclick="window.location.reload()"><i class="ph ph-arrows-clockwise"></i> Refresh</button>
                </div>
            </div>

            <!-- Inventory Overview Grid (Optional Summaries) -->
            <div class="stats-grid" style="grid-template-columns: repeat(3, 1fr); margin-bottom: 2rem;">
                <div class="stat-card">
                    <div class="stat-icon bg-blue-light"><i class="ph-fill ph-package"></i></div>
                    <div class="stat-info">
                        <h3>Total Items</h3>
                        <div class="stat-value" id="total-inventory-count">0</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon bg-orange-light"><i class="ph-fill ph-warning"></i></div>
                    <div class="stat-info">
                        <h3>Low Stock</h3>
                        <div class="stat-value" id="low-stock-count">0</div>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon bg-red-light" style="background:#fee2e2; color:#dc2626;"><i class="ph-fill ph-x-circle"></i></div>
                    <div class="stat-info">
                        <h3>Out of Stock</h3>
                        <div class="stat-value" id="out-of-stock-count">0</div>
                    </div>
                </div>
            </div>

            <!-- Inventory Table -->
            <div class="recent-orders-section">
                <div class="table-responsive">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Product Details</th>
                                <th>Category</th>
                                <th>Size Breakdown</th>
                                <th>Total Stock</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="inventory-table-body">
                            <!-- Rows injected via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Re-use the existing Product Modal for Stock Updates -->
    <!-- (We can either link to it or build a mini-stock update modal) -->

    <script type="module" src="js/admin-inventory.js"></script>
    <script src="admin.js"></script>
</body>
</html>
