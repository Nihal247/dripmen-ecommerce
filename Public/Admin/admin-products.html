<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DripMen Admin | Products</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="../User/css/style.css">
    <link rel="stylesheet" href="admin.css"> <!-- Admin specific styles -->

</head>
<body>
    <div class="admin-container">
        <div class="sidebar-overlay"></div>
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <div class="logo">DRIPMEN</div>
            </div>
            <nav class="sidebar-nav">
                <a href="admin.html" class="nav-item"><i class="ph ph-squares-four"></i> Dashboard</a>
                <a href="admin-users.html" class="nav-item"><i class="ph ph-users"></i> Users</a>
                <a href="admin-products.html" class="nav-item active"><i class="ph ph-t-shirt"></i> Products</a>
                <a href="admin-inventory.html" class="nav-item"><i class="ph ph-stack"></i> Inventory</a>
                <a href="admin-returns.html" class="nav-item"><i class="ph ph-arrow-u-up-left"></i> Returns</a>
                <a href="admin-categories.html" class="nav-item"><i class="ph ph-tag"></i> Categories</a>
                <a href="admin-orders.html" class="nav-item"><i class="ph ph-shopping-cart"></i> Orders</a>
                <a href="admin-coupons.html" class="nav-item"><i class="ph ph-ticket"></i> Coupons</a>
                <a href="admin-banners.html" class="nav-item"><i class="ph ph-image"></i> Banners</a>
                <a href="admin-transactions.html" class="nav-item"><i class="ph ph-receipt"></i> Transactions</a>
                <a href="admin-sales-report.html" class="nav-item"><i class="ph ph-chart-bar"></i> Sales Report</a>
            </nav>
            <div class="sidebar-footer">
                <a href="index.html" class="nav-item"><i class="ph ph-sign-out"></i> Logout</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <!-- Top Header -->
            <header class="admin-header">
                <div class="header-left">
                    <button class="menu-toggle"><i class="ph ph-list"></i></button>
                    <h2 class="page-title">Products</h2>
                </div>
                <div class="header-actions">
                    <div class="admin-profile">
                        <img src="https://ui-avatars.com/api/?name=Admin+User&background=000&color=fff" alt="Admin">
                        <span>Admin</span>
                    </div>
                </div>
            </header>

            <!-- Products Toolbar -->
            <div class="products-toolbar">
               <div class="search-box">
    <i class="ph ph-magnifying-glass"></i>
<input id="productSearch" type="text" placeholder="Search products...">
</div>
                <div class="toolbar-actions">
                    <div class="filters">
                        <select class="filter-select">
                            <option value="">Category</option>
                            <option value="tshirts">T-Shirts</option>
                            <option value="hoodies">Hoodies</option>
                            <option value="jackets">Jackets</option>
                        </select>
                       <select class="filter-select">
  <option value="">Status</option>
  <option value="active">Active</option>
  <option value="inactive">Inactive</option>
  <option value="draft">Draft</option>
  <option value="out_of_stock">Out of Stock</option>
</select>
                    </div>
                    <button class="btn btn-primary add-product-btn"><i class="ph ph-plus"></i> Add Product</button>
                </div>
            </div>

            <!-- Products Table -->
            <div class="recent-orders-section">
                <div class="table-responsive">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Product Name</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Stock</th>
                                <th>Status</th>
                                <th>Sales</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="products-table-body">
                            <!-- Rows injected via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

<!-- Add/Edit Product Modal -->
<div id="productModal" style="display:none; position:fixed; inset:0; background:rgba(15, 23, 42, 0.6); backdrop-filter:blur(4px); z-index:1000; overflow-y:auto; padding: 2rem 1rem;">
  <div style="background:#ffffff; border-radius:20px; padding:2.5rem; width:100%; max-width:600px; margin:0 auto; box-shadow:0 25px 50px -12px rgba(0,0,0,0.15); position:relative;">

    <h3 id="modalTitle" style="margin-bottom:1.5rem; font-weight:700; color:#111;">Add Product</h3>
    <input type="hidden" id="productId">

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">

      <div style="grid-column:1/-1;">
        <label style="display:block; margin-bottom:0.5rem; font-weight:500; color:#374151;">Name *</label>
        <input id="prodName" type="text" placeholder="e.g. Black Hoodie"
          style="width:100%; padding:0.75rem; border-radius:8px; border:1px solid #e9ecef; background:#f8f9fa; color:#111; box-sizing:border-box;">
      </div>

      <div style="grid-column:1/-1;">
        <label style="display:block; margin-bottom:0.5rem; font-weight:500; color:#374151;">Description</label>
        <textarea id="prodDescription" placeholder="Product description" rows="3"
          style="width:100%; padding:0.75rem; border-radius:8px; border:1px solid #e9ecef; background:#f8f9fa; color:#111; box-sizing:border-box; resize:vertical;"></textarea>
      </div>

      <div>
        <label style="display:block; margin-bottom:0.5rem; font-weight:500; color:#374151;">Price * (₹)</label>
        <input id="prodPrice" type="number" placeholder="e.g. 120" min="0"
          style="width:100%; padding:0.75rem; border-radius:8px; border:1px solid #e9ecef; background:#f8f9fa; color:#111; box-sizing:border-box;">
      </div>

      <div>
        <label style="display:block; margin-bottom:0.5rem; font-weight:500; color:#374151;">Sale Price (₹)</label>
        <input id="prodSalePrice" type="number" placeholder="Optional" min="0"
          style="width:100%; padding:0.75rem; border-radius:8px; border:1px solid #e9ecef; background:#f8f9fa; color:#111; box-sizing:border-box;">
      </div>

      <div>
        <label style="display:block; margin-bottom:0.5rem; font-weight:500; color:#374151;">Category *</label>
        <select id="prodCategory"
          style="width:100%; padding:0.75rem; border-radius:8px; border:1px solid #e9ecef; background:#f8f9fa; color:#111; box-sizing:border-box;">
          <option value="">Select Category</option>
        </select>
      </div>

      <div style="grid-column:1/-1;">
        <label style="display:block; margin-bottom:0.5rem; font-weight:500; color:#374151;">Total Stock (Summary)</label>
        <input id="prodStock" type="number" placeholder="Calculated from sizes" readonly
          style="width:100%; padding:0.75rem; border-radius:8px; border:1px solid #e9ecef; background:#f1f5f9; color:#64748b; box-sizing:border-box; cursor:not-allowed;">
      </div>

      <div style="grid-column:1/-1;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem;">
          <label style="font-weight:500; color:#374151;">Inventory per Size *</label>
          <button type="button" onclick="addSizeRow()" style="font-size:0.8rem; background:#111; color:#fff; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">+ Add Size</button>
        </div>
        <div id="size-stock-container" style="display:flex; flex-direction:column; gap:0.5rem; padding:1rem; border:1px solid #e9ecef; border-radius:8px; background:#f8f9fa;">
          <!-- Size rows injected via JS -->
        </div>
        <p style="font-size:0.75rem; color:#888; margin-top:0.4rem;">Example: Size: M, Stock: 20</p>
      </div>

      <div style="grid-column:1/-1;">
        <label style="display:block; margin-bottom:0.5rem; font-weight:500; color:#374151;">Colors (comma separated)</label>
        <input id="prodColors" type="text" placeholder="e.g. black,white"
          style="width:100%; padding:0.75rem; border-radius:8px; border:1px solid #e9ecef; background:#f8f9fa; color:#111; box-sizing:border-box;">
      </div>

      <div style="grid-column:1/-1;">
  <label style="display:block; margin-bottom:0.5rem; font-weight:500; color:#374151;">Images (max 5)</label>

  <input id="prodImages" type="file" accept="image/*" multiple
    style="width:100%; padding:0.75rem; border-radius:8px; border:1px solid #e9ecef; background:#f8f9fa; color:#111; box-sizing:border-box;">

  <!-- Image Preview Container -->
  <div id="imagePreview"
       style="display:flex;gap:12px;margin-top:12px;flex-wrap:wrap;min-height:20px;"></div>
</div>

      <!-- Homepage Section Selector -->
      <div style="grid-column:1/-1;">
        <label style="display:block; margin-bottom:0.75rem; font-weight:500; color:#374151;">
          Show on Homepage
        </label>
        <div style="display:flex; flex-direction:column; gap:0.6rem; padding:1rem; border-radius:8px; border:1px solid #e9ecef; background:#f8f9fa;">
          <label style="display:flex; align-items:center; gap:0.6rem; cursor:pointer; font-size:0.9rem; color:#374151;">
            <input type="checkbox" id="section-new-arrivals" value="new_arrivals"
              style="width:16px; height:16px; accent-color:#111; cursor:pointer;">
            <span>⭐ New Arrivals</span>
            <span style="margin-left:auto; font-size:0.78rem; color:#888;">Shows in the "NEW ARRIVALS" section</span>
          </label>
          <label style="display:flex; align-items:center; gap:0.6rem; cursor:pointer; font-size:0.9rem; color:#374151;">
            <input type="checkbox" id="section-top-selling" value="top_selling"
              style="width:16px; height:16px; accent-color:#111; cursor:pointer;">
            <span>🔥 Top Selling</span>
            <span style="margin-left:auto; font-size:0.78rem; color:#888;">Shows in the "TOP SELLING" section</span>
          </label>
          <label style="display:flex; align-items:center; gap:0.6rem; cursor:pointer; font-size:0.9rem; color:#374151;">
            <input type="checkbox" id="section-explore" value="explore"
              style="width:16px; height:16px; accent-color:#111; cursor:pointer;">
            <span>🧭 Explore</span>
            <span style="margin-left:auto; font-size:0.78rem; color:#888;">Shows in the "EXPLORE OUR PRODUCTS" section</span>
          </label>
        </div>
        <p style="margin-top:0.4rem; font-size:0.78rem; color:#888;">Leave unchecked to hide from homepage</p>
      </div>

    </div>

    <div style="display:flex; gap:1rem; justify-content:flex-end; margin-top:1.5rem;">
      <button onclick="closeModal()"
        style="padding:0.75rem 1.5rem; border-radius:8px; border:1px solid #e9ecef; background:transparent; color:#374151; cursor:pointer; font-weight:500;">
        Cancel
      </button>
      <button onclick="saveProduct()"
        style="padding:0.75rem 1.5rem; border-radius:8px; border:none; background:#111; color:#fff; cursor:pointer; font-weight:600;">
        Save
      </button>
    </div>

  </div>
</div>
<script type="module" src="js/admin-products.js"></script>
    <script src="admin.js"></script>
</body>
</html>
