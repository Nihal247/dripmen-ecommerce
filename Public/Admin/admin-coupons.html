</head>

<body>

<div class="admin-container">

<div class="sidebar-overlay"></div>

<!-- Sidebar -->

<div class="sidebar-header">

</div>

<nav class="sidebar-nav">

<i class="ph ph-t-shirt"></i> Products

<a href="admin-inventory.html" class="nav-item">
<i class="ph ph-stack"></i> Inventory
</a>

<a href="admin-returns.html" class="nav-item">
<i class="ph ph-arrow-u-up-left"></i> Returns
</a>

<a href="admin-categories.html" class="nav-item">
<i class="ph ph-tag"></i> Categories
</a>

<a href="admin-orders.html" class="nav-item">
<i class="ph ph-shopping-cart"></i> Orders

<a href="admin-coupons.html" class="nav-item active">
<i class="ph ph-ticket"></i> Coupons

<a href="admin-banners.html" class="nav-item">

</div>

<!-- Main Content -->
<main class="admin-main">

<!-- Header -->
<header class="admin-header">

<div class="header-left">

<button class="menu-toggle">
<i class="ph ph-list"></i>
</button>

<h2 class="page-title">Coupons</h2>

</div>

<div class="header-actions">
<button class="btn btn-primary" id="open-coupon-modal">
<i class="ph ph-plus"></i> Create Coupon
</button>
</div>

</header>

<!-- Coupons Table -->
<div class="recent-orders-section">
<div class="table-responsive">
<table class="admin-table">
<thead>
<tr>
<th>Code</th>
<th>Discount</th>
<th>Min Purchase</th>
<th>Expiry Date</th>
<th>Status</th>
<th>Action</th>
</tr>
</thead>
<tbody id="coupons-table-body">
<!-- Injected via JS -->
</tbody>
</table>
</div>
</div>

</main>

</div>

<!-- Create Coupon Modal -->
<div id="coupon-modal" class="admin-modal">
<div class="admin-modal-content">
<div class="modal-header">
<h3>Create New Coupon</h3>
<button class="close-modal-btn"><i class="ph ph-x"></i></button>
</div>
<form id="coupon-form" class="admin-form">
<div class="form-group">
<label>Coupon Code</label>
<input type="text" name="code" placeholder="e.g. SUMMER20" required style="text-transform: uppercase;">
</div>
<div class="form-row">
<div class="form-group">
<label>Discount Type</label>
<select name="discountType">
<option value="percentage">Percentage (%)</option>
<option value="fixed">Fixed Amount ($)</option>
</select>
</div>
<div class="form-group">
<label>Value</label>
<input type="number" name="discountValue" required>
</div>
</div>
<div class="form-row">
<div class="form-group">
<label>Min Purchase ($)</label>
<input type="number" name="minPurchase" value="0">
</div>
<div class="form-group">
<label>Expiry Date</label>
<input type="date" name="expiryDate" required>
</div>
</div>
<button type="submit" class="btn btn-primary full-width">Save Coupon</button>
</form>
</div>
</div>

<script src="admin.js"></script>
<script src="js/admin-coupons.js"></script>

</body>
</html>
