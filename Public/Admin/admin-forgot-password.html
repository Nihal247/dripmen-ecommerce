<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DripMen Admin | Forgot Password</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-login-body">
    <div class="login-card">
        <div class="logo login-logo">DRIPMEN</div>
        <p class="login-title">Reset Password</p>
        <p class="login-desc">Enter the email address associated with your account and we'll send you a link to reset your password.</p>
        
        <form class="login-form" id="forgot-form">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <div class="input-wrapper">
                    <i class="ph ph-envelope"></i>
                    <input type="email" class="form-input" placeholder="Enter your email" required>
                </div>
            </div>

            <button type="submit" class="btn-login">Send Reset Link</button>
            
            <div class="form-footer center-footer">
                <a href="admin-login.html" class="back-link"><i class="ph ph-arrow-left"></i> Back to Login</a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('forgot-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = 'Sending...';
            btn.disabled = true;
            btn.style.opacity = '0.7';
            
            setTimeout(() => {
                alert('If an account exists for this email, you will receive password reset instructions.');
                window.location.href = 'admin-login.html';
            }, 1500);
        });
    </script>
</body>
</html>
