<!DOCTYPE html>
<html>
<head><title>Section Debug Test</title></head>
<body>
<h2>Section Filter Debug</h2>
<div id="output" style="font-family:monospace;white-space:pre;background:#f4f4f4;padding:20px;border-radius:8px;"></div>

<script>
const API = "http://localhost:4000";
const out = document.getElementById("output");

async function test() {
  let result = "";

  // 1. Get ALL products - see what sections are saved
  const all = await fetch(`${API}/api/products?limit=20`).then(r=>r.json());
  result += "=== ALL PRODUCTS IN DB ===\n";
  (all.products||[]).forEach(p => {
    result += `  ${p.name}: section = ${JSON.stringify(p.section)}\n`;
  });

  // 2. Test each section filter
  result += "\n=== SECTION FILTER TEST ===\n";
  for (const sec of ["new_arrivals","top_selling","explore"]) {
    const r = await fetch(`${API}/api/products?section=${sec}&limit=10`).then(r=>r.json());
    result += `  ?section=${sec} → ${r.count} products: ${(r.products||[]).map(p=>p.name).join(", ") || "NONE"}\n`;
  }

  out.textContent = result;
}

test().catch(e => { out.textContent = "ERROR: " + e.message; });
</script>
</body>
</html>
